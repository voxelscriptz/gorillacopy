<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark Crawl VR</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000}
#info{position:fixed;top:10px;left:10px;right:10px;z-index:5;color:#ddd;font:14px system-ui,sans-serif;background:#000a;padding:10px 14px;border-radius:10px;pointer-events:none;max-width:420px}
</style>
<script>
window.__errs=[];
window.addEventListener('error',function(e){window.__errs.push(e.message);var i=document.getElementById('info');if(i)i.innerHTML+='<br><span style="color:#ff9">Error: '+e.message+'</span>';});
window.addEventListener('load',function(){var i=document.getElementById('info');if(!i)return;
  if(typeof AFRAME==='undefined')i.innerHTML+='<br><span style="color:#ff9">A-Frame failed to load. Check your connection, or put aframe.min.js next to this file.</span>';
  else window.__errs.forEach(function(m){i.innerHTML+='<br><span style="color:#ff9">Error: '+m+'</span>';});});
</script>
<script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe.min.js"></script>
<script>window.AFRAME||document.write('<script src="https://aframe.io/releases/1.5.0/aframe.min.js"><\/script>');</script>
<script>window.AFRAME||document.write('<script src="https://unpkg.com/aframe@1.5.0/dist/aframe.min.js"><\/script>');</script>
<script>window.AFRAME||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.5.0/aframe.min.js"><\/script>');</script>
<script>window.AFRAME||document.write('<script src="aframe.min.js"><\/script>');</script>
<script>
const THREE=AFRAME.THREE;
AFRAME.registerComponent('gorilla',{
  init(){
    const sc=this.el.object3D,boxes=this.boxes=[];
    // baseplate
    const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
    g.fillStyle='#16161a';g.fillRect(0,0,128,128);g.strokeStyle='#26262e';g.lineWidth=2;g.strokeRect(0,0,128,128);
    const gt=new THREE.CanvasTexture(c);if(THREE.SRGBColorSpace)gt.colorSpace=THREE.SRGBColorSpace;
    gt.wrapS=gt.wrapT=THREE.RepeatWrapping;gt.repeat.set(20,20);
    const ground=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshLambertMaterial({map:gt}));
    ground.rotation.x=-Math.PI/2;sc.add(ground);
    // blocks (x, y, z, width, height, depth, colour)
    const add=(x,y,z,w,h,d,col)=>{
      const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshLambertMaterial({color:new THREE.Color(col)}));
      m.position.set(x,y+h/2,z);sc.add(m);
      boxes.push(new THREE.Box3(new THREE.Vector3(x-w/2,y,z-d/2),new THREE.Vector3(x+w/2,y+h,z+d/2)));
    };
    add(0,0,0,3,2,3,'#4a3a32');          // crate
    add(6,0,-4,1.5,4,1.5,'#555560');     // pillar
    add(-7,0,-3,6,1,2,'#3d3d46');        // low wall
    add(-6,0,6,2,2.5,2,'#4a3a32');       // crate
    add(9,0,5,1,2,1,'#555560');          // platform leg
    add(9,2,5,5,.5,5,'#3d3d46');         // platform
    for(let i=0;i<4;i++)add(-14+i*2,0,-10,2,.6*(i+1),2,'#4a4a52'); // stairs
    add(0,0,-18,16,6,1,'#2e2e36');       // far wall
    // state
    this.vel=new THREE.Vector3();this.push=new THREE.Vector3();
    this.v1=new THREE.Vector3();this.v2=new THREE.Vector3();this.v3=new THREE.Vector3();this.v4=new THREE.Vector3();
    this.el.addEventListener('loaded',()=>{
      this.rig=document.getElementById('rig').object3D;
      this.camObj=document.getElementById('cam').object3D;
      this.flash=document.getElementById('flash');
      this.hands=['lh','rh'].map(id=>({el:document.getElementById(id),prev:new THREE.Vector3(),has:false,touch:false,hist:[]}));
    });
    this.el.addEventListener('enter-vr',()=>{
      document.getElementById('info').style.display='none';
      this.rig.position.set(0,0,12);this.vel.set(0,0,0);this.spawnTicks=10;
    });
    this.el.addEventListener('exit-vr',()=>{
      document.getElementById('info').style.display='block';
      this.rig.position.set(0,0,12);this.vel.set(0,0,0);
    });
    this.flick=0;
    // PC controls
    this.keys={};this.grounded=false;
    this.q=new THREE.Quaternion();this.pf=new THREE.Vector3();this.pd=new THREE.Vector3();this.pr=new THREE.Vector3();
    window.addEventListener('keydown',e=>{this.keys[e.code]=true;if(e.code==='Space')e.preventDefault();});
    window.addEventListener('keyup',e=>{this.keys[e.code]=false;});
  },
  pcCollide(){
    // three stacked spheres (feet, waist, head) so a standing player collides properly
    const rig=this.rig,vel=this.vel,p=this.v1,n=this.v2;
    for(const h of [.3,.9,1.4]){
      for(let k=0;k<2;k++){
        p.copy(rig.position);p.y+=h;
        if(!this.collide(p,.3))break;
        rig.position.add(this.push);
        n.copy(this.push).normalize();
        const dd=vel.dot(n);if(dd<0)vel.addScaledVector(n,-dd);
        if(n.y>.5)this.grounded=true;
      }
    }
  },
  pcTick(ms){
    const dt=Math.min(ms/1000,.05)||.016,rig=this.rig,vel=this.vel,k=this.keys,f=this.pf,d=this.pd,r=this.pr;
    this.camObj.getWorldQuaternion(this.q);
    f.set(0,0,-1).applyQuaternion(this.q);f.y=0;
    if(f.lengthSq()<1e-6)f.set(0,0,-1);f.normalize();
    r.set(-f.z,0,f.x);
    const ix=(k.KeyD?1:0)-(k.KeyA?1:0),iz=(k.KeyW?1:0)-(k.KeyS?1:0);
    const sp=(k.ShiftLeft||k.ShiftRight)?7:4;
    d.set(0,0,0).addScaledVector(f,iz).addScaledVector(r,ix);
    if(d.lengthSq()>0)d.normalize().multiplyScalar(sp);
    const a=Math.min(1,(this.grounded?12:3)*dt);
    vel.x+=(d.x-vel.x)*a;vel.z+=(d.z-vel.z)*a;
    vel.y-=9.8*dt;
    if(this.grounded&&k.Space){vel.y=4.8;}
    this.grounded=false;
    const n=Math.max(1,Math.ceil(vel.length()*dt/.08));
    for(let i=0;i<n;i++){rig.position.addScaledVector(vel,dt/n);this.pcCollide();}
    if(this.grounded&&vel.y<0)vel.y=0;
    rig.position.x=Math.max(-19.5,Math.min(19.5,rig.position.x));
    rig.position.z=Math.max(-19.5,Math.min(19.5,rig.position.z));
  },
  buzz(h){try{h.el.components['tracked-controls'].controller.gamepad.hapticActuators[0].pulse(.6,40);}catch(e){}},
  collide(p,r){
    const push=this.push,cp=this.v3,dv=this.v4;push.set(0,0,0);let hit=false;
    if(p.y<r){push.y+=r-p.y;hit=true;}
    for(const b of this.boxes){
      cp.set(Math.max(b.min.x,Math.min(p.x,b.max.x)),Math.max(b.min.y,Math.min(p.y,b.max.y)),Math.max(b.min.z,Math.min(p.z,b.max.z)));
      dv.subVectors(p,cp);const d2=dv.lengthSq();
      if(d2<r*r){hit=true;if(d2>1e-8){const d=Math.sqrt(d2);push.addScaledVector(dv,(r-d)/d);}else push.y+=b.max.y-p.y+r;}
    }
    return hit;
  },
  bodyCollide(){
    const rig=this.rig,vel=this.vel,p=this.v1,n=this.v2;
    for(let k=0;k<3;k++){
      this.camObj.getWorldPosition(p);
      let hit=this.collide(p,.3);
      if(!hit){p.y-=.4;hit=this.collide(p,.25);}
      if(!hit)break;
      rig.position.add(this.push);
      n.copy(this.push).normalize();
      const d=vel.dot(n);if(d<0)vel.addScaledVector(n,-d);
      if(n.y>.5){vel.x*=.85;vel.z*=.85;}
    }
  },
  tick(t,ms){
    // flickering flashlight
    if(this.flash){
      const l=this.flash.getObject3D('light');
      if(l){if(this.flick<=0&&Math.random()<.004)this.flick=.12+Math.random()*.2;
        if(this.flick>0){this.flick-=ms/1000;l.intensity=Math.random()<.5?.2:1.2;}else l.intensity=2;}
    }
    if(!this.hands)return;
    if(!this.el.is('vr-mode')){this.pcTick(ms);return;}
    const dt=Math.min(ms/1000,.05)||.016,rig=this.rig,vel=this.vel,tmp=this.v1,tmp2=this.v2;
    if(this.spawnTicks>0){
      this.spawnTicks--;
      if(this.spawnTicks===0){this.camObj.getWorldPosition(tmp);rig.position.y+=1.2-tmp.y;vel.set(0,0,0);}
      return;
    }
    let touching=0,released=null;const move=new THREE.Vector3(),HR=.1;
    for(const h of this.hands){
      const tc=h.el.components['tracked-controls'];
      if(!tc||!tc.controller){h.has=false;h.touch=false;continue;}
      const cur=h.el.object3D.position;
      if(!h.has){h.prev.copy(cur);h.has=true;}
      tmp.copy(cur).add(rig.position);
      const hit=this.collide(tmp,HR);
      if(hit){
        move.add(tmp2.subVectors(h.prev,cur));touching++;
        h.hist.push(tmp2.subVectors(cur,h.prev).divideScalar(dt).clone());if(h.hist.length>6)h.hist.shift();
        if(!h.touch)this.buzz(h);
      }else if(h.touch)released=h;else h.hist.length=0;
      h.touch=hit;h.prev.copy(cur);
    }
    if(touching){
      rig.position.addScaledVector(move,1/touching);vel.set(0,0,0);
      for(const h of this.hands)if(h.touch){tmp.copy(h.el.object3D.position).add(rig.position);if(this.collide(tmp,HR))rig.position.add(this.push);}
    }else{
      if(released&&released.hist.length){
        const s=new THREE.Vector3();released.hist.forEach(v=>s.add(v));s.divideScalar(released.hist.length);
        vel.copy(s).multiplyScalar(-1.25);if(vel.length()>12)vel.setLength(12);released.hist.length=0;
      }
      vel.y-=9.8*dt;vel.multiplyScalar(1-.1*dt);
      const n=Math.max(1,Math.ceil(vel.length()*dt/.08));
      for(let i=0;i<n;i++){rig.position.addScaledVector(vel,dt/n);this.bodyCollide();}
    }
    this.bodyCollide();
    // keep inside the baseplate
    rig.position.x=Math.max(-19.5,Math.min(19.5,rig.position.x));
    rig.position.z=Math.max(-19.5,Math.min(19.5,rig.position.z));
  }
});
</script>
</head>
<body>
<div id="info"><b>Dark Crawl</b><br>Press the VR goggles button (bottom right). You hang low and move with your hands: reach down, push off the ground and blocks, release to launch. Gravity is on.<br><b>On PC:</b> drag the mouse to look, WASD to walk, Shift to run, Space to jump. Gravity and collisions are on.</div>
<a-scene gorilla fog="type:linear;color:#050508;near:2;far:30" renderer="antialias:true" webxr="optionalFeatures:local-floor,bounded-floor" background="color:#050508">
  <a-entity light="type:ambient;color:#334;intensity:0.5"></a-entity>
  <a-entity id="rig" position="0 0 12">
    <a-entity id="cam" camera look-controls position="0 1.6 0">
      <a-entity id="flash" light="type:spot;color:#fff2d8;intensity:2;angle:38;penumbra:0.6;distance:30;decay:1" position="0 0 0"></a-entity>
    </a-entity>
    <a-entity id="lh" oculus-touch-controls="hand:left"><a-sphere radius="0.07" color="#555"></a-sphere></a-entity>
    <a-entity id="rh" oculus-touch-controls="hand:right"><a-sphere radius="0.07" color="#555"></a-sphere></a-entity>
  </a-entity>
</a-scene>
</body>
</html>
